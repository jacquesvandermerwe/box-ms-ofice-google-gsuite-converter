# Box Configuration
# Option 1: Use Developer Token (quick testing, expires in 60 minutes)
# box.developer.token=YOUR_BOX_DEV_TOKEN

# Option 2: Use JWT Config File (production, auto-refreshing)
# Download from Box Developer Console → Your App → Configuration → "Generate a Developer Token" section
box.config.file=/Users/jvandermerwe/Documents/Box/Config JSON/JVDM Box CLI Config.json

# Box As-User Header (optional)
# If using service account/JWT, specify the Box user ID to act as
# This allows the service account to access files owned by this user
# Find user ID: https://app.box.com/master/settings (look in URL or use Box API)
box.as.user.id=3312464263

# Google Drive Configuration - OAuth Mode (Personal Account)
# google.auth.type=oauth
# google.credentials.file=/absolute/path/to/oauth-client-credentials.json
# google.application.name=Box-Google-Converter

# Google Drive Configuration - Service Account Mode (Google Workspace)
google.auth.type=service_account
google.credentials.file=/Users/jvandermerwe/eclipse-workspace/box-google-converter/credentials/box-prod-gsuitemigrationapi-9d83e73f171f.json
google.application.name=Box-Google-Converter
google.impersonate.user=gcp-console@vertium.xyz
# Default Workspace user when CSV user_email is "ignored" (service account mode only)
# google.impersonate.user=user@yourdomain.com

# Database Configuration
db.path=./migration-results.db

# Spring Boot Configuration
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:sqlite:./migration-results.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Web Server Port
server.port=8080

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Threading Configuration (Virtual Threads)
# Virtual threads are lightweight - you can use much higher values than platform threads
# Each virtual thread handles one file migration (I/O bound operation)
# Recommended: 50-200 for most use cases, 500+ for large-scale migrations
thread.pool.size=100
thread.pool.max.size=500

# CSV Input
csv.input.path=./input.csv

# Retry Configuration
retry.max.attempts=3
retry.delay.seconds=5
